[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pagerwesi"
version = "0.10.1"
description = "Cross-platform security baseline auditing and controlled remediation"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
azure = [
    "azure-identity>=1.17,<2",
    "azure-mgmt-keyvault>=10,<15",
    "azure-mgmt-monitor>=7,<8",
    "azure-mgmt-network>=28,<33",
    "azure-mgmt-resource>=23,<27",
    "azure-mgmt-security>=7,<8",
    "azure-mgmt-sql>=3,<5",
    "azure-mgmt-storage>=22,<26",
    "azure-mgmt-subscription>=3,<4",
]
gcp = [
    "google-auth>=2.29,<3",
    "google-cloud-compute>=1.20,<2",
    "google-cloud-iam>=2,<3",
    "google-cloud-kms>=3,<4",
    "google-cloud-logging>=3.10,<4",
    "google-cloud-resource-manager>=1.12,<2",
    "google-cloud-storage>=2.16,<4",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<3",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]
k8s = ["kubernetes>=29,<37"]

[project.scripts]
pagerwesi = "cloud.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["cloud*"]
exclude = ["cloud.tests*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests", "cloud/tests"]
markers = [
    "integration: optional tests that require external services such as LocalStack",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["cloud"]

[tool.coverage.report]
fail_under = 60

[[tool.mypy.overrides]]
module = ["azure.mgmt.*", "boto3", "boto3.*", "google.cloud.*", "yaml", "jsonschema", "kubernetes", "kubernetes.*"]
ignore_missing_imports = true
